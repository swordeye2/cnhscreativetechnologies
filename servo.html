<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servo Motor & Power Physics Simulator • RP2040 Lab</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { width: 100%; background: #181825; border-bottom: 1px solid #313244; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .nav-link { color: #89b4fa; text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .nav-link:hover { text-decoration: underline; }
    .content-wrapper { padding: 25px 20px; width: 100%; max-width: 1050px; }
    h1 { color: #89b4fa; margin-top: 0; margin-bottom: 5px; text-align: center; }
    p.subtitle { color: #a6adc8; margin-top: 0; margin-bottom: 25px; font-size: 0.95rem; text-align: center; }
    
    /* Layout Grid: Simulator on Left, Code & Math Inspector on Right */
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid-container { grid-template-columns: 1fr; } }

    .card { background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    
    /* Visualizer Boxes */
    .vis-box { width: 100%; background: #11111b; border: 1px solid #313244; border-radius: 8px; margin-bottom: 12px; overflow: hidden; position: relative; }
    svg { display: block; width: 100%; height: auto; }

    /* Key Concept Highlight Box */
    .concept-banner { background: #313244; border-left: 4px solid #f9e2af; padding: 10px 14px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 15px; color: #cdd6f4; line-height: 1.4; }

    /* Code & Math Inspector Styling */
    .code-box { background: #11111b; border: 1px solid #313244; border-radius: 8px; padding: 12px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.82rem; line-height: 1.5; overflow-x: auto; margin-bottom: 12px; }
    .code-line { padding: 2px 6px; border-radius: 4px; color: #a6adc8; }
    .code-line.active { background: #313244; color: #a6e3a1; font-weight: bold; border-left: 3px solid #a6e3a1; padding-left: 3px; }
    .kw { color: #f38ba8; }
    .fn { color: #89b4fa; }
    .num { color: #fab387; }
    .cm { color: #6c7086; font-style: italic; }
    .val-highlight { color: #f9e2af; font-weight: bold; }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .control-block { background: #11111b; border: 1px solid #313244; border-radius: 6px; padding: 10px; }
    .control-block label { display: block; font-size: 0.8rem; font-weight: bold; color: #89b4fa; margin-bottom: 6px; }

    select, input[type=range] { width: 100%; background: #313244; color: #cdd6f4; border: 1px solid #45475a; border-radius: 4px; padding: 6px; font-size: 0.85rem; }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    button { background: #89b4fa; color: #11111b; border: none; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s ease; flex-grow: 1; }
    button:hover { background: #b4befe; }
    button.secondary { background: #313244; color: #cdd6f4; }
    button.secondary:hover { background: #45475a; }
    button.action { background: #f9e2af; color: #11111b; }

    .status-panel { width: 100%; margin-top: 10px; background: #11111b; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.82rem; border: 1px solid #313244; }
